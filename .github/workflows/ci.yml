name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scanner
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  wallet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  issuer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: issuer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            issuer/package-lock.json
      # The SDK tests run against the real issuer, so it needs its packages too.
      - run: npm ci --prefix issuer
      - run: npm ci --prefix sdk
      - run: npm run typecheck --prefix sdk
      - run: npm test --prefix sdk

  origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            origin/package-lock.json
            sdk/package-lock.json
            issuer/package-lock.json
      # End-to-end tests: the real issuer and SDK against the origin.
      - run: npm ci --prefix issuer
      - run: npm ci --prefix sdk
      - run: npm ci --prefix origin
      - run: npm run typecheck --prefix origin
      - run: npm test --prefix origin

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            origin/package-lock.json
            sdk/package-lock.json
            issuer/package-lock.json
      - run: npm ci --prefix issuer
      - run: npm ci --prefix sdk
      - run: npm ci --prefix origin
      - run: npm ci --prefix demo
      - run: npm run typecheck --prefix demo
      - run: npm test --prefix demo

  web:
    # Playwright 1.56 installs browsers on Ubuntu 24.04, not on 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            demo/package-lock.json
            origin/package-lock.json
            issuer/package-lock.json
      - run: npm ci --prefix issuer
      - run: npm ci --prefix origin
      - run: npm ci --prefix demo
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  token-canary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: token-canary/package-lock.json
      - run: npm ci
      - run: node canary.mjs
      - run: node native-sign.mjs
