name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scanner
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  wallet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  issuer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: issuer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  token-canary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: token-canary/package-lock.json
      - run: npm ci
      - run: node canary.mjs
      - run: node native-sign.mjs
